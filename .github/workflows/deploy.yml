name: K8s CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cicd-demo
  EKS_CLUSTER: dev-cluster
  NAMESPACE: dev

jobs:
  build-and-deploy:
    name: Build + Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 - Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # Step 3 - Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4 - Build Docker image
      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY ./app
          echo "Image built successfully ✅"

      # Step 5 - Tag image with commit SHA
      - name: Tag Docker image
        run: |
          ECR_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          docker tag $ECR_REPOSITORY:latest $ECR_URI:latest
          docker tag $ECR_REPOSITORY:latest $ECR_URI:${{ github.sha }}
          echo "ECR_URI=$ECR_URI" >> $GITHUB_ENV

      # Step 6 - Push to ECR
      - name: Push to ECR
        run: |
          docker push $ECR_URI:latest
          docker push $ECR_URI:${{ github.sha }}
          echo "Pushed to ECR ✅"

      # Step 7 - Update kubeconfig for EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      # Step 8 - Create namespace if not exists
      - name: Create namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # Step 9 - Update image in deployment
      - name: Update image in deployment
        run: |
          sed -i "s|\${{ AWS_ACCOUNT_ID }}|${{ secrets.AWS_ACCOUNT_ID }}|g" k8s/deployment.yaml

      # Step 10 - Deploy to EKS
      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/deployment.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s/service.yaml -n ${{ env.NAMESPACE }}
          echo "Deployed to EKS ✅"

      # Step 11 - Update image to latest
      - name: Update deployment image
        run: |
          kubectl set image deployment/cicd-demo \
            cicd-demo=$ECR_URI:${{ github.sha }} \
            -n ${{ env.NAMESPACE }}

      # Step 12 - Wait for rollout
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/cicd-demo \
            -n ${{ env.NAMESPACE }} \
            --timeout=120s
          echo "Rollout complete ✅"

      # Step 13 - Get app URL
      - name: Get app URL
        run: |
          kubectl get service cicd-demo-service \
            -n ${{ env.NAMESPACE }}
