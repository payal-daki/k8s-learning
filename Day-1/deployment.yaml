apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  # namespace: dev   ← remove this line!
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: nginx:latest
          ports:
            - containerPort: 80
