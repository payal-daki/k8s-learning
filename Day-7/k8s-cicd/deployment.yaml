apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-demo
  template:
    metadata:
      labels:
        app: cicd-demo
    spec:
      containers:
        - name: cicd-demo
          image: ${{ AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/cicd-demo:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
